# SwiftGet build configuration.
#
# The host toolchain is x86_64-pc-windows-gnu with an incomplete self-contained
# MinGW: GNU `dlltool` cannot run (no bundled `as.exe` assembler). Many deps
# (`windows-sys`, `windows-registry`, ...) use `#[link(kind = "raw-dylib")]`,
# which makes rustc generate import libraries at link time via `dlltool`.
#
# LLVM's dlltool produces corrupt import tables once feature-unified `windows-sys`
# grows large enough (duplicate import descriptors with null IAT thunks) ->
# STATUS_ACCESS_VIOLATION (0xC0000005) at process startup.
#
# We avoid raw-dylib for the windows-link stack via `vendor/windows-link` (see
# root `Cargo.toml` `[patch.crates-io]`). Prebuilt import archives live under
# `.toolbin/winlibs/` (generate with `.toolbin/gen-winlibs.ps1`). Crates that
# still call raw-dylib directly (e.g. `getrandom`) use `.toolbin/dlltool-wrap.exe`
# as `-Cdlltool`; paths are injected with an absolute path via `.toolbin/rustc-wrap.exe`
# because rustc resolves `-Cdlltool` relative to each crate output directory.
#
# MSVC / non-GNU targets: this file's `[target.x86_64-pc-windows-gnu]` and
# `[build]` wrapper apply only on that target. See docs/BUILD_WINDOWS_GNU.md.

[env]
# Workspace-root paths for `.toolbin/rustc-wrap.exe` (dependency crates may not see `.toolbin` when walking from cwd).
SWIFTGET_DLLTOOL_WRAP = { value = ".toolbin/dlltool-wrap.exe", relative = true }
SWIFTGET_WINLIBS = { value = ".toolbin/winlibs", relative = true }

[build]
# MSVC: omit this line, or install helpers via build-dlltool-wrap.ps1 on GNU hosts only.
rustc-wrapper = ".toolbin/rustc-wrap.exe"

# Only when compiling/linking for x86_64-pc-windows-gnu.
[target.x86_64-pc-windows-gnu]
rustflags = [
    "-Lnative=.toolbin/winlibs",
]
