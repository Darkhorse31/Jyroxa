[workspace]
resolver = "2"
members = [
    "crates/jyroxa-core",
    "crates/jyroxa-cli",
    "crates/jyroxa-ffi",
    "apps/desktop/src-tauri",
]
default-members = [
    "crates/jyroxa-core",
    "crates/jyroxa-cli",
    "crates/jyroxa-ffi",
]
# apps/desktop (Tauri) lives under apps/desktop; build separately (see docs/BUILD_WINDOWS_GNU.md).

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
authors = ["Prateek Kumar"]
repository = "https://github.com/jyroxa/jyroxa"
rust-version = "1.75"

[workspace.dependencies]
# NOTE: deliberately NOT using the "full" meta-feature. On this host
# (x86_64-pc-windows-gnu, no MSVC/MinGW C toolchain) import libraries for
# `raw-dylib` are generated by LLVM's dlltool. Tokio's optional `parking_lot`
# feature pulls a windows-sys surface that, unioned with mio's, triggers a bad
# import thunk and an access violation at startup. We therefore take every
# `full` feature except `parking_lot`.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "io-std",
    "fs",
    "process",
    "signal",
] }
reqwest = { version = "0.12", default-features = true, features = ["stream"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
url = "2"
regex = "1"
rand = "0.8"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
bytes = "1"
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Windows GNU raw-dylib workaround: see .cargo/config.toml for the full story.
# Patches `windows-link` to link classically against correct prebuilt import
# archives instead of synthesising corrupt raw-dylib import libraries.
[patch.crates-io]
windows-link = { path = "vendor/windows-link" }
