[package]
name = "jyroxa-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Jyroxa desktop download manager (Tauri)"

[features]
# Internal stdin/stdout harness; excluded from normal desktop distributions.
release-gate = []

[[bin]]
name = "jyroxa-release-gate"
path = "src/bin/release_gate.rs"
required-features = ["release-gate"]

[lib]
name = "jyroxa_desktop_lib"
# MinGW ld chokes on huge cdylib export tables (ordinarly >64k); desktop links as rlib.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jyroxa-core = { path = "../../../crates/jyroxa-core", default-features = false, features = ["telegram"] }
jyroxa-native-host = { path = "../../../crates/jyroxa-native-host" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

