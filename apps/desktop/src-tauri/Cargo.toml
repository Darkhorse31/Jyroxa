[package]
name = "jyroxa-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Jyroxa desktop download manager (Tauri)"

[lib]
name = "jyroxa_desktop_lib"
# Desktop links the lib as rlib/staticlib into the exe. cdylib on Windows pulls in
# every grammers symbol into the DLL export table (65535 ordinal limit).
crate-type = ["rlib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jyroxa-core = { path = "../../../crates/jyroxa-core", features = ["telegram"] }
jyroxa-native-host = { path = "../../../crates/jyroxa-native-host" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
regex = { workspace = true }
winreg = "0.55"

