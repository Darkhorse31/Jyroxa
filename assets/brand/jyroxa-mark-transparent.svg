<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="jyroxaGradientTrans" x1="12%" y1="12%" x2="88%" y2="88%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <mask id="chevronNotchMask">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <g transform="rotate(34 256 256)">
        <line x1="396" y1="238" x2="468" y2="238" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
      </g>
    </mask>
  </defs>
  
  <!-- Central core rotor dot -->
  <circle cx="256" cy="256" r="30" fill="url(#jyroxaGradientTrans)"/>

  <!-- Orbit 1: Guide gimbal, tilted -34 deg -->
  <g transform="rotate(-34 256 256)">
    <ellipse cx="256" cy="256" rx="178" ry="90" fill="none" stroke="url(#jyroxaGradientTrans)" stroke-width="40"/>
  </g>

  <!-- Orbit 2: Velocity ring with mask for true transparent notch -->
  <g transform="rotate(34 256 256)" mask="url(#chevronNotchMask)">
    <ellipse cx="256" cy="256" rx="178" ry="90" fill="none" stroke="url(#jyroxaGradientTrans)" stroke-width="40"/>
  </g>

  <!-- Chevron drawn unmasked -->
  <g transform="rotate(34 256 256)">
    <polygon points="432,306 396,246 468,246" fill="url(#jyroxaGradientTrans)"/>
    <polygon points="432,284 412,246 452,246" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>