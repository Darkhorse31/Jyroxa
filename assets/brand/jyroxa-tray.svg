<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <mask id="trayNotch">
      <rect width="32" height="32" fill="#FFFFFF"/>
      <g transform="rotate(34 16 16)">
        <line x1="24.5" y1="14.8" x2="29.5" y2="14.8" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </mask>
  </defs>

  <circle cx="16" cy="16" r="2.2" fill="currentColor"/>

  <!-- Orbit 1: Tilted -34 deg -->
  <g transform="rotate(-34 16 16)">
    <ellipse cx="16" cy="16" rx="11.2" ry="5.6" stroke="currentColor" stroke-width="2.6"/>
  </g>

  <!-- Orbit 2: Tilted +34 deg with mask cut -->
  <g transform="rotate(34 16 16)" mask="url(#trayNotch)">
    <ellipse cx="16" cy="16" rx="11.2" ry="5.6" stroke="currentColor" stroke-width="2.6"/>
  </g>

  <!-- Arrowhead on Orbit 2 -->
  <g transform="rotate(34 16 16)">
    <polygon points="27.2,19.2 24.8,15.4 29.4,15.4" fill="currentColor"/>
  </g>
</svg>