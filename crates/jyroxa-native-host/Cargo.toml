[package]
name = "jyroxa-native-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Chrome/Firefox native messaging host for Jyroxa browser integration"

[[bin]]
name = "jyroxa-native-host"
path = "src/main.rs"

[[bin]]
name = "jyroxa-browser-register"
path = "src/bin/jyroxa-browser-register.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "io-std", "rt", "macros"] }

[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["net"] }
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
